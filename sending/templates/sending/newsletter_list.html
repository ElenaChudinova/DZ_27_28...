{% extends 'sending/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for newsletter in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">{{ newsletter.letter }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                {% if user.is_authenticated %}
                                <a class="btn btn-primary" href="{% url 'sending:newsletter_update' newsletter.pk %}"
                                   role="button">Редактировать</a>
                                <a class="btn btn-primary" href="{% url 'sending:newsletter_delete' newsletter.pk %}"
                                   role="button">Удалить</a>
                                {% endif %}
                                <a class="btn btn-primary" href="{% url 'sending:newsletter_detail' newsletter.pk %}"
                                   role="button">Инфо</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
