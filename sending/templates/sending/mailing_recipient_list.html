{% extends 'sending/base.html' %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for mailing_recipient in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">{{ mailing_recipient.email }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'sending:mailing_recipient_detail' mailing_recipient.pk %}"
                                   role="button">Подробнее</a>
                                 <a class="btn btn-primary" href="{% url 'sending:mailing_recipient_update' mailing_recipient.pk %}"
                                   role="button">Редактировать</a>
                                 <a class="btn btn-primary" href="{% url 'sending:mailing_recipient_delete' mailing_recipient.pk %}"
                                   role="button">Удалить</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
